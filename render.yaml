services:
  # 1. Next.js Frontend
  - type: web
    name: frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        sync: false

  # 2. FastAPI UI Backend
  - type: web
    name: ui-client
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.ui_client
    envVars:
      - key: LEAD_FINDER_SERVICE_URL
        sync: false
      - key: SDR_SERVICE_URL
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false

  # 3. Lead Finder Service
  - type: web
    name: lead-finder
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.lead_finder
    envVars:
      - key: LEAD_MANAGER_SERVICE_URL
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: BING_SUBSCRIPTION_KEY
        sync: false

  # 4. Lead Manager Service
  - type: web
    name: lead-manager
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.lead_manager
    envVars:
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false

  # 5. SDR Voice Service
  - type: web
    name: sdr
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.sdr
    envVars:
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
